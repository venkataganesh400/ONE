<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone compliance (no border radius so Android can crop any shape) -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Inner safe-zone container (scaled down by 75% to sit completely within the center 80% circle safe zone) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Focus Orbit Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="32 16" transform="rotate(-30 256 256)" opacity="0.75" />

    <!-- Center Geometric '1' + Monogram -->
    <g filter="url(#shadow)">
      <path d="M 210 180 L 256 140 L 276 140 L 276 370 L 236 370 L 236 186 Z" fill="url(#glow)" />
      <rect x="180" y="348" width="152" height="26" rx="13" fill="url(#glow)" />
      <circle cx="340" cy="180" r="18" fill="#38bdf8" />
      <circle cx="170" cy="300" r="10" fill="#a855f7" />
    </g>
  </g>
</svg>
