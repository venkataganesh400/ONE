<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="monolith" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Obsidian Background for Android Maskable Safe Zone -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Safe-zone Centered Emblem (80% safe circle) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Subtle Grey Architectural Ring -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#27272a" stroke-width="6" />

    <!-- Smooth White Focus Arc -->
    <path
      d="M 256 88 A 168 168 0 0 1 424 256"
      fill="none"
      stroke="#ffffff"
      stroke-width="6"
      stroke-linecap="round"
    />

    <!-- Architectural Geometric '1' Monolith -->
    <polygon points="196,204 244,156 244,204" fill="#a1a1aa" />
    <rect x="244" y="156" width="44" height="200" rx="6" fill="url(#monolith)" />
  </g>
</svg>
