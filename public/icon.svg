<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="monolith" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
  </defs>

  <!-- Minimal Obsidian Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Subtle Grey Architectural Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#27272a" stroke-width="6" />

  <!-- Smooth White Focus Arc (Top-Right Quadrant) -->
  <path
    d="M 256 88 A 168 168 0 0 1 424 256"
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Architectural Geometric '1' Monolith -->
  <g>
    <!-- Subtle Silver Folded Wing / Flag -->
    <polygon points="196,204 244,156 244,204" fill="#a1a1aa" />
    <!-- Pure White Primary Stem -->
    <rect x="244" y="156" width="44" height="200" rx="6" fill="url(#monolith)" />
  </g>
</svg>
